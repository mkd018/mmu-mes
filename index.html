<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MMU MES</title>

<style>
body{
font-family:Arial;
background:#0b0f14;
color:white;
text-align:center;
margin:0;
}

h1{
margin-top:80px;
}

.loginBox{
background:#161b22;
padding:40px;
width:320px;
margin:auto;
margin-top:80px;
border-radius:12px;
box-shadow:0 0 30px rgba(0,0,0,0.6);
}

input{
display:block;
margin:12px auto;
padding:12px;
width:85%;
border:none;
border-radius:6px;
}

button{
padding:12px 24px;
background:#00b4ff;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#0096d4;
}

#result{
margin-top:40px;
white-space:pre-wrap;
font-size:14px;
padding:20px;
}
</style>

</head>

<body>

<h1>MMU MES</h1>

<div class="loginBox">

<h2>Login</h2>

<input id="sicil" placeholder="Sicil">

<input id="sifre" type="password" placeholder="Şifre">

<button onclick="login()">Login</button>

</div>

<pre id="result"></pre>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbwDkcNMmcV-_3s8aaFW1lqXdCRxGJ4T0S9BsebU6vYaxUplyKOtM9I_SvX3pr8OCFs/exec"

async function login(){

const sicil=document.getElementById("sicil").value
const sifre=document.getElementById("sifre").value

try{

const response=await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
action:"LOGIN",
sicil:sicil,
sifre:sifre
})
})

const data=await response.json()

document.getElementById("result").innerText=
JSON.stringify(data,null,2)

}catch(error){

document.getElementById("result").innerText="Hata: "+error

}

}

</script>

</body>
</html>
